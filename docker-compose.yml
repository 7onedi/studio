services:
  app:
    build:
      context: .
      dockerfile: ./docker/Dockerfile
    working_dir: /app
    env_file: .env

    volumes:
      - ./prisma:/app/prisma
      - uploads_data:/app/public/uploads

    restart: always

    ports:
      - "3000:3000"

    tmpfs:
      - /tmp:rw,noexec,nosuid,size=64m
    stop_grace_period: 60s

    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

    mem_limit: 3g
    cpus: "1.0"

    entrypoint: /entrypoint.sh

    depends_on:
      studio_pangeya_mysql:
        condition: service_healthy


  studio_pangeya_nginx:
    image: nginx:1.19
    restart: always

    depends_on:
      - app

    volumes:
      - ./docker/nginx:/etc/nginx/conf.d
      - uploads_data:/app/public/uploads 

    ports:
      - "81:80"


  studio_pangeya_mysql:
    image: mysql:8
    container_name: studio-mysql
    restart: always
    env_file:
      - .env

    ports:
      - "3307:3306"
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -p$${MYSQL_ROOT_PASSWORD} --silent"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 10s
    stop_grace_period: 60s

    volumes:
      - studio-mysql-data:/var/lib/mysql


volumes:
  studio-mysql-data:
  uploads_data: