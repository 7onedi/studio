services:
  app:
    build:
      context: .
      dockerfile: ./docker/Dockerfile
    working_dir: /app
    env_file: .env

    environment:
      NODE_ENV: production

    restart: always

    ports:
      - "3000:3000"

    tmpfs:
      - /tmp:rw,noexec,nosuid,size=64m

    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

    mem_limit: 3g
    cpus: "1.0"

    entrypoint: /entrypoint.sh

    depends_on:
      - studio_pangeya_mysql


  studio_pangeya_nginx:
    image: nginx:1.19
    restart: always

    depends_on:
      - app

    volumes:
      - ./docker/nginx:/etc/nginx/conf.d

    ports:
      - "80:80"


  studio_pangeya_mysql:
    image: mysql:8
    container_name: studio-mysql
    restart: always

    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: studio
      MYSQL_USER: studio_user
      MYSQL_PASSWORD: studio_pass
      TZ: Europe/Kyiv

    ports:
      - "3306:3306"

    volumes:
      - studio-mysql-data:/var/lib/mysql


volumes:
  studio-mysql-data:
