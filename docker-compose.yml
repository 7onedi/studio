services:
  app:
    build:
      context: .
      dockerfile: ./docker/Dockerfile
    working_dir: /app
    env_file: .env
    environment:
      - NODE_ENV=production
      - NODE_OPTIONS=--require=/app/trace-exec.cjs
    restart: always
    ports:
      - "3000:3000"

    # 1) /tmp як tmpfs + noexec: зламає запуск /tmp/x.sh, /tmp/lrt і т.д.
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=64m

    # 2) Ротація логів, щоб не роздувало диск
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

    # 3) Ліміти ресурсів (працюють у docker compose)
    mem_limit: 3g
    cpus: "1.0"

    # 4) Монтуємо проєкт (включно з trace-exec.cjs)
    volumes:
      - .:/app

    entrypoint: /entrypoint.sh
    ports:
      - "3000:3000"
    depends_on:
      - studio_pangeya_mysql   # ← додано

  studio_pangeya_nginx:
    image: nginx:1.19
    restart: always
    depends_on:
      - app
    volumes:
      - ./docker/nginx:/etc/nginx/conf.d
    depends_on:
      - studio_pangeya_app

  studio_pangeya_mysql:                # ← НОВИЙ СЕРВІС
    image: mysql:8
    container_name: studio-mysql
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: studio
      MYSQL_USER: studio_user
      MYSQL_PASSWORD: studio_pass
      TZ: Europe/Kyiv
    ports:
      - "3306:3306"
    volumes:
      - studio-mysql-data:/var/lib/mysql   # <--- Docker volume
volumes:
  studio-mysql-data:
